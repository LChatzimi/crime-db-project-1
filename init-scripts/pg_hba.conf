# Allow all connections
host    all             all             0.0.0.0/0               trust
host    all             all             ::/0                    trust

# Allow replication from anywhere
host    replication     bdr             0.0.0.0/0               trust
host    replication     bdr             ::/0                    trust

# Local trust
host    replication     bdr             127.0.0.1/32            trust
host    replication     bdr             ::1/128                 trust
local   all             all                                     trust
local   replication     bdr                                     trust
