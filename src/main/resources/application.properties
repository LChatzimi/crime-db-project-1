spring.datasource.url=jdbc:postgresql://localhost:5000/bdrdb
spring.datasource.username=bdr
spring.datasource.password=bdrpass
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.batch_size=5000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.flushMode=COMMIT
spring.application.name=api
server.servlet.context-path=/api